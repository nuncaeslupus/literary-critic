[project]
name = "literary-critic"
version = "0.1.22"
description = "LLM-assisted novel indexing, analysis and revision feedback"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["doc-control[live]>=0.8.4,<0.9"]  # stdlib + doc-control only (AGENTS.md rule 9)

[project.optional-dependencies]
# kept for older installs: the live engine (pywin32 on Windows) is now a main dependency
live = ["doc-control[live]>=0.8.4,<0.9"]

[project.scripts]
lc = "litcritic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litcritic"]

# A staged update installs the wheel alone: it carries the tree files the tool reads.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "litcritic/_tree/prompts"
"schemas" = "litcritic/_tree/schemas"
"checklist" = "litcritic/_tree/checklist"
"docs/codex" = "litcritic/_tree/docs/codex"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["claude-arsenal", ".claude", "arsenal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typography (dashes, curly quotes, guillemets) is the subject matter here.
"src/litcritic/{metrics,prepass,textstats,structure,view}.py" = ["RUF001"]
"tests/*.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"  # the claude.ai chat sandbox
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

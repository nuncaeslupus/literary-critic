[project]
name = "literary-critic"
version = "0.1.0"
description = "LLM-assisted novel indexing, analysis and revision feedback"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["doc-control>=0.2.0,<0.3"]  # stdlib + doc-control only (AGENTS.md rule 9)

[project.scripts]
lc = "litcritic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litcritic"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["claude-arsenal", ".claude", "arsenal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typography (dashes, curly quotes, guillemets) is the subject matter here.
"src/litcritic/{metrics,prepass,textstats,structure,view}.py" = ["RUF001"]
"tests/*.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"  # the claude.ai chat sandbox
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
doc-control = { git = "https://github.com/nuncaeslupus/doc-control", rev = "b04298e" }

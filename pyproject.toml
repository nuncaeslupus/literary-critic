[project]
name = "literary-critic"
version = "0.1.0"
description = "LLM-assisted novel indexing, analysis and revision feedback"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []  # runtime is stdlib only (see AGENTS.md rule 7)

[project.scripts]
lc = "litcritic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litcritic"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["claude-arsenal", ".claude", "arsenal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

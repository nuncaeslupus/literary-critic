id = "orientation"
title = "Orientation and first read"
stage = "orientation"
order = 0
purpose = "Understand what the novel is trying to be before judging it: the writer's brief, premise, genre and reader promise, intended reader, the book's own design and ambitions. The output is the novel profile (traits, mode, conventions, assumptions) that selects and shapes every later check, plus a log of honest first impressions and strengths recorded before analysis colours them."

[[check]]
id = "orientation.writer-brief"
title = "Writer's brief and constraints"
question = "What does the writer want from this review: draft stage, their own worries, what they will not change, and any external targets (submission, length, readership, deadline)?"
look_for = ["no stated goal, so depth and mode are guesses", "the writer's worries differ from what the text signals", "fixed constraints (length, series, commissioned scope) that rule out some actions"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0"]
evidence = "The writer's stated goals, worries and constraints quoted or paraphrased from their own words, kept separate from the assistant's assumptions; missing items become questions for the writer."

[[check]]
id = "orientation.premise"
title = "Premise and one-paragraph summary"
question = "What is this novel about, in a few sentences a stranger could follow, and what is it about underneath?"
look_for = ["no summary can be written without hedging", "surface subject and underlying concern diverge", "premise only becomes clear late"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0", "L1"]
evidence = "Summary of the book from L0/L1 with chapter references for each claim; list what remains unclear after the first read."

[[check]]
id = "orientation.genre-promise"
title = "Genre and reader promise"
question = "Which genre, tradition or shelf does the book signal, and what does it promise a reader (pleasure, effect, kind of ending)?"
look_for = ["signals of several genres without a dominant one", "genre named by the writer differs from what the text signals", "conventions the book visibly plays against or subverts"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0", "L1", "L2"]
evidence = "Genre or tradition label(s) with the scenes that signal them, and the promise in one or two lines; stated assumption if the writer did not declare the genre. Recorded, not judged: whether the opening's promise is kept is opening.opening-promise, and how conventions are honoured is genre-and-reader.genre-conventions."

[[check]]
id = "orientation.intended-reader"
title = "Intended reader"
question = "Who is the book written for, and what knowledge, patience and values does it assume of that reader?"
look_for = ["no stated target readership, so the implied reader must be inferred", "textual signals (register, content, assumed knowledge) pointing to different readerships", "background the text assumes (culture, period, specialism) that the target reader may lack"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0", "L1"]
evidence = "Writer's stated target (if any), the textual signals of the implied reader, and a list of assumptions the text makes; recorded, not judged. Overall fit is genre-and-reader.reader-fit; specific outside knowledge is world-coherence.external-context."

[[check]]
id = "orientation.own-design"
title = "The book's own design and ambitions"
question = "What is the novel attempting formally and thematically, and by what standard (its own, not a default template) should it be judged?"
look_for = ["unusual structure or voice that is clearly deliberate", "declared ambition (by the writer) not visible on the page", "formal choices that conflict with each other"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0", "L1", "L2"]
evidence = "Short statement of the design with 2-4 anchors showing where the choice is visible; the writer's stated intentions kept separate from inferred ones. Later checks cite this design before calling a departure from convention a defect."

[[check]]
id = "orientation.language-conventions"
title = "Language and typographic conventions"
question = "What language, variety, tense, person and dialogue/quotation conventions does the manuscript use, so scripts and checks can be configured?"
look_for = ["the dominant form where several coexist (spelling variety, dialogue marks, dash style)", "conventions the writer declares versus those the text actually uses", "foreign terms or other languages that scripts must be told about"]
method = "hybrid"
kind = "inventory"
action_level = "none"
inputs = ["metrics", "L3"]
metrics = ["quote_style_consistency", "tense_consistency"]
evidence = "Detected conventions with counts and sample locations, recorded as the book's working style sheet; the LLM reads only the sampled passages to confirm which are intentional. Deviations are judged later in dialogue.punctuation-conventions, lexicon-and-sound.language-variety, style-and-syntax.tense-slips and manuscript-closure.orthotypography."

[[check]]
id = "orientation.first-impressions"
title = "First impressions log"
question = "What did the first read produce before analysis: where attention rose or fell, what confused, and which questions the reader carried at each point and later lost or had answered?"
look_for = ["confusion at specific points", "attention dropping over a stretch, a point where a reader would put the book down", "a question the reader held and later lost", "unanswered questions piling up", "an emotional peak the reader was not prepared for"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L1", "L3"]
evidence = "A chapter-by-chapter log of attention and open questions, each entry tied to a chapter or passage, with a confidence level; impressions are recorded as reader experience, not diagnosis, and later confirmed or dismissed by analysis (the engagement curve is judged in pacing.tension-curve)."

[[check]]
id = "orientation.first-strengths"
title = "What grips on first read"
question = "On a first read, what works best — the passages, qualities or effects that make a reader keep going and that later revision must protect?"
look_for = ["passages the reader remembers after closing the book", "a distinctive voice or angle", "moments of strong emotion or surprise"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["L0", "L1", "L2"]
evidence = "Each strength with anchors and a one-line reason; this list is carried into every later stage as 'protect'."

[[check]]
id = "orientation.profile"
title = "Novel profile: traits, mode and open questions"
question = "Which catalogue traits apply, is the work a revision or a reader report, and is the profile complete enough to start analysis?"
look_for = ["a trait declared but never exercised in the text", "a trait present in the text but not declared", "mode unclear from the request", "assumption stated as fact", "open questions never put to the writer"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L0", "L1", "structure", "findings"]
evidence = "The assembled profile: each trait with one anchor, chosen mode, checks or areas switched off with the reason, each field's source; questions for the writer listed separately."

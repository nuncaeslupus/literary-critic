id = "time-and-narrative-levels"
title = "Time and narrative levels"
stage = "developmental"
order = 16
purpose = "Make sure the reader always knows when and from where something is being told: story chronology versus order of telling, flashbacks and flash-forwards, character ages, the narrator's position, and levels nested inside one another. Source of knowledge and memory reliability are checked here because they determine how much the telling can be trusted."

[[check]]
id = "time-and-narrative-levels.chronology-map"
title = "Story chronology versus telling order"
question = "What is the real order of events in the story, and how does the order of telling differ?"
look_for = ["telling order that obscures cause and effect", "events placed out of order without effect", "a timeline that cannot be reconstructed"]
method = "hybrid"
kind = "inventory"
action_level = "none"
inputs = ["L1", "L2", "timeline"]
metrics = ["timeline_gap_count"]
evidence = "Two sequences side by side (story order and chapter order) with dates or relative markers, and the mismatches listed."

[[check]]
id = "time-and-narrative-levels.analepsis-prolepsis"
title = "Flashbacks and flash-forwards"
question = "Where does the telling leave the main time, how far does it go, and why does the reader need it at that moment?"
look_for = ["a flashback interrupting a high-tension moment", "a flash-forward that spoils a later effect", "backstory placed where it delays the story"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "timeline"]
evidence = "Each excursion with location, reach (how far it goes), length and what it does for the present scene."
severity = { high = "A time excursion confuses the order of events or deflates a key moment.", medium = "Placement or length weakens momentum.", low = "Excursion works but could be tighter." }

[[check]]
id = "time-and-narrative-levels.time-jumps"
title = "Time jumps and ellipses"
question = "Are jumps in time signalled, proportionate and consequential, and is the passage of time felt?"
look_for = ["unmarked leap of years", "a gap in which characters change without explanation", "continuity of seasons or ages broken by a jump"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "timeline", "metrics"]
metrics = ["timeline_gap_count"]
evidence = "Jump locations with the stated or inferred interval and what is lost or changed across it."
severity = { high = "Jump leaves the reader lost or hides a change essential to the story.", medium = "Signalled late or vaguely.", low = "Fine but could be clearer." }

[[check]]
id = "time-and-narrative-levels.ages-per-episode"
title = "Characters' ages at each episode"
question = "What age is each key character at each episode, and do behaviour, knowledge and vocabulary match it?"
look_for = ["a child who reasons as an adult without explanation", "ages that do not add up across the book", "a time span incompatible with the events"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "timeline", "L2"]
metrics = ["timeline_gap_count"]
evidence = "Age table by chapter from the timeline register, with the episode where ages and behaviour conflict."
severity = { high = "Arithmetic of ages or dates contradicts events.", medium = "Behaviour does not match age in a notable scene.", low = "Small inconsistency." }

[[check]]
id = "time-and-narrative-levels.narrator-position"
title = "Narrator's age and position when telling"
question = "From what time, place and state does the narrator tell, and does the telling use that position consistently?"
look_for = ["the narrator knowing what the character then could not", "retrospective comments appearing and disappearing", "narrator-now and character-then blurred"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "L3"]
applies_when = ["retrospective_narrator", "first_person"]
evidence = "Passages revealing the telling position and passages that conflict with it."
severity = { high = "The telling position is unstable so knowledge or judgement is confused.", medium = "Position is clear but inconsistently used.", low = "Slip in a single sentence." }

[[check]]
id = "time-and-narrative-levels.nested-levels"
title = "Nested narrative levels"
question = "What levels exist (frame, story, memory within story, account by another character) and how do they relate?"
look_for = ["a story told by one character containing details only another knew", "levels that merge without notice", "a reconstructed scene presented as direct experience"]
method = "llm"
kind = "inventory"
action_level = "none"
inputs = ["L1", "L2", "structure"]
applies_when = ["nested_narration"]
evidence = "Level map: each level, its narrator, its time, and the passages where it begins and ends."

[[check]]
id = "time-and-narrative-levels.level-signalling"
title = "Signalling of level changes"
question = "Does the reader always know which level, time and speaker they are in?"
look_for = ["no marker at the change", "markers that are inconsistent between levels", "tense or voice shifting without cue"]
method = "hybrid"
kind = "diagnostic"
action_level = "line"
inputs = ["L2", "L3", "metrics"]
metrics = ["tense_consistency"]
applies_when = ["nested_narration", "nonlinear_time", "dual_timeline", "retrospective_narrator"]
evidence = "Each level change with its marker (or absence) quoted, and a confusion rating by a first-time reader."
severity = { high = "The reader loses the level or time in a way that damages comprehension.", medium = "Markers missing or inconsistent at several points.", low = "Marker exists but could be more consistent." }

[[check]]
id = "time-and-narrative-levels.knowledge-source"
title = "Source of knowledge"
question = "For each important fact, scene or thought, how does the narrator come to know it (experience, testimony, documents, deduction, invention)?"
look_for = ["private scenes narrated without a source", "precise detail from a distant witness", "knowledge appearing before it could have been learned"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3", "relationships"]
applies_when = ["first_person", "retrospective_narrator", "nested_narration", "unreliable_narrator"]
evidence = "Passages with the apparent source, the plausible source, and the gap between them."
severity = { high = "Narration relies on knowledge that is impossible for the stated source without being signalled.", medium = "Source plausible but unsignalled in several places.", low = "Occasional unsignalled inference." }

[[check]]
id = "time-and-narrative-levels.memory-reliability"
title = "Memory and reliability"
question = "Does the book treat memory as fallible where it matters, and are reconstructions marked as such?"
look_for = ["verbatim recall of long-past conversations", "detail contradicting the narrator's own earlier account", "uncertainty claimed once and then ignored"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3"]
applies_when = ["retrospective_narrator", "unreliable_narrator", "nested_narration", "first_person"]
evidence = "Reconstructions with their claimed certainty and any hedge markers; contradictions between accounts quoted."
severity = { high = "Reliability is contradictory and the reader cannot tell what to trust.", medium = "Reliability handled inconsistently.", low = "Style choice that could be signalled once more." }

[[check]]
id = "time-and-narrative-levels.duration-space"
title = "Duration versus space"
question = "Does the amount of text given to each period or event fit its importance: scene, summary or ellipsis?"
look_for = ["years in a paragraph and an hour in chapters with no reason", "key events summarised", "trivial events dramatised at length"]
method = "hybrid"
kind = "diagnostic"
action_level = "structural"
inputs = ["L1", "L2", "timeline", "metrics"]
metrics = ["scene_summary_ratio", "words_per_scene"]
evidence = "Table of story duration against words, per block, and the passages where scene and summary seem misallocated."
severity = { high = "A pivotal event is summarised or a trivial one dominates a large share.", medium = "Allocation is uneven in places.", low = "Mild imbalance." }

[[check]]
id = "time-and-narrative-levels.time-strength"
title = "Time-handling strengths"
question = "Where does the handling of time or levels create an effect worth preserving?"
look_for = ["a time shift that adds meaning", "two periods that illuminate each other", "a smooth entry into memory"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["L1", "L2", "timeline"]
evidence = "Named passages with the effect produced."

id = "motifs-and-setups"
title = "Motifs and setups"
stage = "developmental"
order = 30
purpose = "Track the repeated images, objects and phrases, and the promises the text makes and fulfils. Motifs earn their place by changing across the book; setups need payoffs and payoffs need setups. Over-reading is as much a risk as under-reading."

[[check]]
id = "motifs-and-setups.motif-inventory"
title = "Motif inventory"
question = "Which recurring images, objects, phrases and symbols does the book use, with first appearance, transformations, payoff and final function?"
look_for = ["a motif defined in one place only", "two motifs that are really one", "search terms that would find the motif"]
method = "hybrid"
kind = "inventory"
action_level = "none"
inputs = ["motifs", "L2", "metrics"]
metrics = ["motif_occurrences"]
evidence = "Motif register rows: id, search terms, first appearance, transformations by chapter, payoff, final function."

[[check]]
id = "motifs-and-setups.motif-development"
title = "Motif transformation"
question = "Does each significant motif change meaning as the book proceeds, or merely repeat?"
look_for = ["identical use each time", "a motif that collapses into decoration", "transformation only at the end"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["motifs", "L2", "metrics"]
metrics = ["motif_occurrences"]
evidence = "Occurrence timeline per motif with the sense of each use, and where it stagnates."
severity = { high = "A main motif repeats without development or is contradicted.", medium = "Several motifs are static.", low = "Minor motif repeated lightly." }

[[check]]
id = "motifs-and-setups.structural-objects"
title = "Structural objects"
question = "Which objects or events recur to organise the book (a letter, a house, a journey), and do they hold the structure together?"
look_for = ["an object introduced and dropped", "object appearing only for convenience", "structure resting on an object the reader cannot track"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["motifs", "ledger", "L2"]
evidence = "Objects with their appearances by chapter and their structural job."
severity = { high = "A structural object disappears or contradicts itself.", medium = "Role is vague or uneven.", low = "Secondary object." }

[[check]]
id = "motifs-and-setups.symbol-networks"
title = "Crossing symbol networks"
question = "How do motifs interact (pair, contrast, cross), and does the network make or confuse meaning?"
look_for = ["symbols with contradictory meaning", "motif collisions that muddy", "networks only visible to a specialist"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["motifs", "L2"]
evidence = "Pairs of motifs with scenes where they meet and the effect."
severity = { high = "Symbol clashes produce incoherent meaning.", medium = "Network is overdense or accidental.", low = "Rich but unfocused." }

[[check]]
id = "motifs-and-setups.overinterpretation"
title = "Explicit symbols versus over-interpretation"
question = "Is the symbolic reading of an element supported by the text, or imposed by the reader or by the text's own commentary?"
look_for = ["narrator explaining the symbol", "analysis of things the text does not stress", "symbolism more prominent than the story"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["motifs", "L2", "L3"]
evidence = "Passages where symbolism is announced, and elements the analysis suspects of being over-read."
severity = { high = "Text spells out symbols so thoroughly that they stop working.", medium = "Some symbols over-explained.", low = "Minor explanatory sentence." }

[[check]]
id = "motifs-and-setups.vanishing-motifs"
title = "Motifs that vanish unresolved"
question = "Which motifs are strongly introduced and then disappear without a payoff or deliberate silence?"
look_for = ["a motif with a long gap", "a motif never closed", "a promise made by a motif and abandoned"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["motifs", "ledger", "metrics"]
metrics = ["motif_occurrences", "setup_payoff_distance"]
evidence = "Motifs with last appearance, gaps, and judgement whether the silence is meaningful."
severity = { high = "A prominent motif is dropped in a way that leaves the reader waiting.", medium = "Several motifs fade.", low = "Minor motif unfinished." }

[[check]]
id = "motifs-and-setups.setups-payoffs"
title = "Setups and payoffs (ledger)"
question = "Does each prominent setup have a payoff, and does each payoff have a setup?"
look_for = ["objects introduced and never used", "solutions using unmentioned facts", "payoff too close or too far from setup"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["ledger", "L2", "metrics"]
metrics = ["setup_payoff_distance", "open_thread_count"]
evidence = "Ledger rows: setup chapter, payoff chapter, distance and status (paid, dangling, unplanted)."
severity = { high = "A major setup is unpaid or a major payoff unprepared.", medium = "Several dangling minor setups.", low = "Setup left for atmosphere." }

[[check]]
id = "motifs-and-setups.opening-ending"
title = "Opening-ending correspondences"
question = "Do the opening and ending speak to each other (image, question, phrase), and is that intended?"
look_for = ["an opening image never returning", "an echo that is accidental", "an ending that has no relation to the beginning"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "motifs"]
evidence = "Opening and closing passages quoted side by side with the relation described."
severity = { high = "The ending ignores or contradicts what the opening established.", medium = "Correspondence is weak.", low = "Opportunity for an echo." }

[[check]]
id = "motifs-and-setups.title-relation"
title = "Relation to the title"
question = "How does the title connect to the text, and does the connection deepen, mislead or arrive too late?"
look_for = ["title phrase never appearing", "meaning of the title explained flatly", "title promising something else"]
method = "llm"
kind = "diagnostic"
action_level = "none"
inputs = ["L0", "L1", "motifs"]
evidence = "Title, the passages that bear on it, and the effect on reading."
severity = { high = "Title misleads about the book's nature.", medium = "Connection is weak or arrives late.", low = "Could be reinforced." }

[[check]]
id = "motifs-and-setups.motif-strength"
title = "Motif strengths"
question = "Which motifs and setups work best and must be preserved when cutting?"
look_for = ["a motif that changes the meaning of an earlier scene", "an object that quietly carries the theme", "a payoff that surprises and satisfies"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["motifs", "ledger", "L2"]
evidence = "Named motifs or setups with chapters and effect."

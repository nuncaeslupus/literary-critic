id = "dialogue"
title = "Dialogue"
stage = "scene"
order = 44
purpose = "Check what speech does: advance the scene, reveal character through subtext, give each speaker a distinct voice and register, and read as speech without becoming transcript. Dialect and reconstructed speech need particular care."

[[check]]
id = "dialogue.dialogue-purpose"
title = "Purpose of dialogue"
question = "What does each dialogue exchange accomplish beyond passing information?"
look_for = ["small talk with no function", "dialogue restating the narration", "exchange ending where it began"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3", "metrics"]
metrics = ["dialogue_ratio"]
evidence = "Exchanges with their function; those with none flagged."
severity = { high = "Large amounts of dialogue serve no purpose.", medium = "Several exchanges lack function.", low = "One exchange." }

[[check]]
id = "dialogue.subtext"
title = "Subtext"
question = "Do speakers want something they do not say, evade, interrupt or lie?"
look_for = ["characters stating their feelings plainly", "nobody withholds", "conflict resolved by explicit statement"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3"]
evidence = "Exchanges quoted with what is said versus what is meant."
severity = { high = "Dialogue is on the nose throughout important scenes.", medium = "Subtext is sparse.", low = "Several scenes could carry more implicit meaning." }

[[check]]
id = "dialogue.voices"
title = "Distinct voices and registers"
question = "Can characters be told apart by diction, rhythm, vocabulary and length of turn?"
look_for = ["same sentence rhythm in every mouth", "narrator's vocabulary in a child's speech", "register not matching social position"]
method = "hybrid"
kind = "diagnostic"
action_level = "line"
inputs = ["characters", "L3", "metrics"]
metrics = ["dialogue_ratio", "mtld", "long_speech_count"]
evidence = "Sample lines from different speakers; metrics (turn length, vocabulary) as pointers."
severity = { high = "Several main speakers sound the same.", medium = "Distinctions blur in some scenes.", low = "Slight similarity among minor speakers." }

[[check]]
id = "dialogue.exposition-dialogue"
title = "Exposition in dialogue"
question = "Do characters tell each other what both already know for the reader's sake?"
look_for = ["'as you know' constructions", "names and relations spelled out unnaturally", "complete explanations in speech"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3"]
evidence = "Quoted lines with what both speakers already know."
severity = { high = "Exposition-by-dialogue carries major information in an implausible way.", medium = "Several noticeable instances.", low = "Single instance." }

[[check]]
id = "dialogue.tags-beats"
title = "Tags and beats"
question = "Are tags and action beats varied, unobtrusive and used to place the speakers?"
look_for = ["tags with adverbs", "complex verbs replacing said", "floating lines with no speaker", "beats overused"]
method = "hybrid"
kind = "diagnostic"
action_level = "line"
inputs = ["L3", "metrics"]
metrics = ["dialogue_tag_distribution", "adverb_density"]
evidence = "Tag distribution and adverb-modified tag counts; examples quoted."
severity = { high = "Tags interfere with reading in long stretches or speakers are unclear.", medium = "Tags habitually adorned or repetitive.", low = "Occasional bookism." }

[[check]]
id = "dialogue.realism-readability"
title = "Realism versus readability"
question = "Does speech sound like speech while staying easy to read and not transcribing every hesitation?"
look_for = ["transcript-like repetition", "perfectly formed sentences in tense moments", "hesitations on every line"]
method = "llm"
kind = "diagnostic"
action_level = "line"
inputs = ["L3", "metrics"]
metrics = ["sentence_length_mean", "exclamation_ellipsis_density"]
evidence = "Quoted lines at both extremes."
severity = { high = "Speech is either unreadable or implausibly polished across the book.", medium = "Imbalance in several scenes.", low = "Mild stiffness." }

[[check]]
id = "dialogue.dialect-handling"
title = "Dialect and non-standard speech"
question = "Are dialect, slang and non-standard forms rendered consistently and readably, without caricature?"
look_for = ["phonetic spelling changing between lines", "a stereotype in the accent", "dialect dropped under pressure"]
method = "hybrid"
kind = "diagnostic"
action_level = "line"
inputs = ["L3", "metrics"]
metrics = ["name_variant_count", "quote_style_consistency"]
applies_when = ["dialect_or_period_language", "translated_or_multilingual"]
evidence = "Forms with variants and counts; judgement of consistency and respect."
severity = { high = "Rendering is inconsistent or caricatured in a way that harms reading or fairness.", medium = "Some inconsistency.", low = "Minor variation." }

[[check]]
id = "dialogue.reconstructed-speech"
title = "Plausibility of reconstructed dialogue"
question = "When dialogue is reported from memory, hearsay or documents, does its form fit that status?"
look_for = ["long verbatim speech from distant memory", "conversation nobody present could have recorded", "uniform voices in reported speech"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3"]
applies_when = ["retrospective_narrator", "nested_narration", "first_person"]
evidence = "Reconstructed dialogues with their claimed source and plausibility."
severity = { high = "Reconstructed dialogue is presented as exact in key scenes with no cue.", medium = "Cue inconsistently supplied.", low = "Convention accepted." }

[[check]]
id = "dialogue.dialogue-length"
title = "Dialogue length and speeches"
question = "Are speeches proportionate, and does dialogue alternate with action or narration?"
look_for = ["monologues over long stretches", "talking heads", "dialogue lines too short to carry content"]
method = "script"
kind = "diagnostic"
action_level = "scene"
inputs = ["metrics", "L3"]
metrics = ["long_speech_count", "dialogue_ratio"]
evidence = "Counts of long speeches and dialogue ratio by chapter against the book's baseline."
severity = { high = "Long speeches dominate key chapters.", medium = "Several overlong speeches.", low = "Single speech." }

[[check]]
id = "dialogue.dialogue-strength"
title = "Dialogue strengths"
question = "Where does speech crackle and should be protected?"
look_for = ["an exchange where the subtext leaps", "a distinct verbal tic", "humour in speech"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["L3", "characters"]
evidence = "Quoted exchanges and why they work."

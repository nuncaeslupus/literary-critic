id = "opening"
title = "Opening"
stage = "developmental"
order = 34
purpose = "The opening carries a disproportionate share of the reader's decision to continue. Check the first scene's force and hook, the presentation of narrator and world, and whether what is promised there is what the book delivers."

[[check]]
id = "opening.first-scene"
title = "First scene force"
question = "Does the first scene establish a person, a situation and a reason to read on?"
look_for = ["scene without a person", "scene without anything at stake", "opening that only describes"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "L3"]
evidence = "The first scene's content, voice and question quoted, plus what the reader knows and wants at its end."
severity = { high = "The opening gives the reader no reason to continue.", medium = "The opening is serviceable but generic or slow.", low = "Strong but with minor drag." }

[[check]]
id = "opening.hook"
title = "Hook and opening span"
question = "How many words pass before the first question, conflict or disruption?"
look_for = ["many paragraphs of orientation before any question", "hook appearing late", "hook not belonging to the book's real subject"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["L2", "L3", "metrics"]
metrics = ["opening_hook_span"]
evidence = "Word count to the first hook, candidate sentence, and the LLM's confirmation that it is a real hook."
severity = { high = "No hook appears in the opening chapter.", medium = "Hook arrives late relative to the genre promise.", low = "Hook is present and could come sooner." }

[[check]]
id = "opening.narrator-presentation"
title = "Narrator presentation"
question = "How is the narrator introduced and does the reader quickly know who tells and why to trust them?"
look_for = ["narrator unclear after the first pages", "self-introduction by inventory", "narrator voice at odds with the rest"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L3"]
evidence = "Passages that establish the narrator and what remains unclear after the opening."
severity = { high = "The reader cannot tell who tells or from where.", medium = "The narrator's stance emerges late.", low = "Presentation is clear but flat." }

[[check]]
id = "opening.world-entry"
title = "Entry into the story world"
question = "Is the reader oriented in time, place and situation quickly enough, without a flood of explanation?"
look_for = ["no sense of when or where", "the first pages as exposition", "unfamiliar terms in the first paragraph"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["L3", "metrics"]
metrics = ["new_term_density", "long_paragraph_rate"]
evidence = "First pages with the orienting facts present or missing, term density and paragraph length."
severity = { high = "The reader cannot orient or is overwhelmed in the first pages.", medium = "Orientation is slow or heavy.", low = "Small clarity gap." }

[[check]]
id = "opening.introductions"
title = "Introduction of main characters"
question = "Are the main characters introduced at a pace the reader can follow, and with something that makes them distinct?"
look_for = ["many names in the first chapter", "protagonist absent from the opening", "introduction by list of traits"]
method = "hybrid"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "L2", "metrics"]
metrics = ["character_first_appearance", "new_term_density"]
evidence = "Names introduced in the opening span with the manner of each introduction."
severity = { high = "The reader cannot track who matters.", medium = "Cast arrives too fast or too slow.", low = "Introductions generic." }

[[check]]
id = "opening.seeded-conflict"
title = "Seeded motifs and central conflict"
question = "Does the opening plant the central conflict and the key motifs, without announcing them?"
look_for = ["no hint of the book's real question", "motifs introduced in later chapters only", "central conflict explained, not shown"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "motifs", "ledger"]
evidence = "Opening elements linked to the later motifs register and central question."
severity = { high = "The opening gives no hint of the central conflict or promises something else.", medium = "Few seeds are planted.", low = "Seeds are present but weak." }

[[check]]
id = "opening.information-control"
title = "Information withheld versus given"
question = "What does the opening reveal and conceal, and is the withholding purposeful or confusing?"
look_for = ["unexplained references with no pay-off in sight", "too much given too early", "secrets that read as author coyness"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["L1", "L2", "ledger"]
evidence = "List of facts given and withheld in the opening and the point at which the withheld facts arrive."
severity = { high = "Withholding makes the opening unintelligible or spoils the book's later effect.", medium = "Withholding is clumsy.", low = "Slight imbalance." }

[[check]]
id = "opening.false-starts"
title = "False starts"
question = "Does the opening begin where the story starts, or does it begin earlier or elsewhere (prologue, preamble, throat-clearing)?"
look_for = ["a prologue repeated later", "several beginnings", "start before anything happens"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["L1", "L2", "L3"]
evidence = "Candidate true start with the preceding text and what it contributes."
severity = { high = "Several chapters precede the real beginning.", medium = "A page or two of preamble.", low = "A line or two." }

[[check]]
id = "opening.opening-promise"
title = "Promise and delivery"
question = "Does the opening make a promise (tone, genre, stakes) that the rest of the book keeps?"
look_for = ["opening in a register the book abandons", "stakes that disappear", "genre signals that mislead"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["L0", "L1", "L3"]
evidence = "Promise stated from the opening and the later evidence of its keeping or breaking."
severity = { high = "Opening promises something the book does not deliver.", medium = "Promise is partly kept.", low = "Slight tonal mismatch." }

[[check]]
id = "opening.opening-strength"
title = "Opening strengths"
question = "What works in the opening and must be preserved when revising it?"
look_for = ["a first sentence with pull", "a voice established at once", "an image that returns"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["L3", "motifs"]
evidence = "Quoted lines and what they do."

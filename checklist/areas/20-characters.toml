id = "characters"
title = "Characters"
stage = "developmental"
order = 20
purpose = "Check that characters function in the story, give the reader a reason to follow them, want things, contradict themselves, change (or deliberately do not) and act on their own account. Also check the economy of the cast: who is needed, who overlaps, and who exists only to carry the author's ideas."

[[check]]
id = "characters.cast-register"
title = "Character register"
question = "Who are the named and unnamed characters, with aliases, roles, first and last chapter present, and their weight?"
look_for = ["the same person under several names", "named characters who appear once", "a crowd of names introduced in one chapter"]
method = "hybrid"
kind = "inventory"
action_level = "none"
inputs = ["L1", "characters", "metrics"]
metrics = ["character_presence_matrix", "character_first_appearance"]
evidence = "Register rows: name, aliases, role, first appearance, presence span; sourced from the index and the presence matrix."

[[check]]
id = "characters.reader-investment"
title = "Reason to follow the protagonist"
question = "What makes the reader want to stay with the protagonist (or central figures) — sympathy, fascination, curiosity, recognition, dread — and is it established early and sustained?"
look_for = ["a protagonist with no visible desire, wound, quality or mystery in the first chapters", "investment built and then dissipated", "a deliberately unlikeable figure with nothing compelling in its place"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["characters", "L1", "L2"]
evidence = "The source(s) of investment named with the scenes that create them, by chapter, and the stretches where it fades. Likeability is not required; an absence of any hook is the finding."
severity = { high = "The reader has no reason to care what happens to the central figure(s) for a large part of the book.", medium = "Investment arrives late or wanes over a block.", low = "Investment is present but could be sharpened early." }

[[check]]
id = "characters.function"
title = "Function of main characters"
question = "What does each significant character do for the book (drive, oppose, mirror, inform, embody an idea), and is any function the story needs left unfilled?"
look_for = ["a character whose function is only to explain", "a function the plot needs that nobody fills", "a main character whose role shrinks to nothing"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["characters", "L1", "L2"]
evidence = "Per character: function stated in a sentence with the scenes in which it is exercised."
severity = { high = "A major character has no function or a needed function is unfilled.", medium = "Function present but thin or fading.", low = "Function could be sharpened." }

[[check]]
id = "characters.want-need"
title = "Desire and inner contradiction"
question = "What does the character consciously want, what do they lack or fear, and where do these conflict? Does inner contradiction produce choices?"
look_for = ["traits listed but never in conflict", "goals that vanish", "a want only stated by others"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["characters", "L1", "L2"]
evidence = "For main characters: want, lack or fear (using want/need only where the book's design suits it), contradictions, and the scenes where these show in action."
severity = { high = "The protagonist has no discernible desire or inner tension driving choices, and the design does not substitute another engine.", medium = "Desire or contradiction is vague or arrives late.", low = "Present but underused." }

[[check]]
id = "characters.arcs"
title = "Arcs, including flat arcs"
question = "Does each major character change, or hold firm while the world changes, in a way the book designs and delivers?"
look_for = ["change that happens offstage or by announcement", "arc started and not finished", "a character static without that stasis meaning anything"]
method = "llm"
kind = "diagnostic"
action_level = "structural"
inputs = ["characters", "L1", "L2", "timeline"]
evidence = "Arc type per character (positive, negative, flat, static by design), the scenes marking the stages, and how the ending reflects it."
severity = { high = "A main arc is missing, contradictory or unearned.", medium = "Arc exists but beats are missing or rushed.", low = "Arc is sound; some steps could be stronger." }

[[check]]
id = "characters.psychological-plausibility"
title = "Psychological plausibility and consistency"
question = "Do reactions and choices fit what the character is, knows and has been through, and are departures motivated?"
look_for = ["sudden change of temperament", "emotional response out of scale with events", "inconsistency across chapters"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "L2", "relationships"]
evidence = "Scenes where behaviour strains consistency, with the earlier scene that sets the expectation. Deliberate inconsistency (a character who surprises with prepared cause) is not a finding."
severity = { high = "A decisive action contradicts the character with no cause.", medium = "Behaviour jumps in a notable scene.", low = "Small inconsistencies." }

[[check]]
id = "characters.distinctiveness"
title = "Distinctiveness"
question = "Could each main character be recognised by action, perception, habit and manner without a name?"
look_for = ["characters interchangeable in their choices and reactions", "shared tics or gestures across the cast", "types instead of individuals"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "L2"]
evidence = "Pairs or groups that blur, with the scenes where they act alike and what differentiates them on paper. Speech distinctiveness belongs to dialogue."
severity = { high = "Several main characters are indistinguishable.", medium = "Distinctions blur in some scenes.", low = "Slight overlap among minor roles." }

[[check]]
id = "characters.secondary-cast"
title = "Secondary characters and cast economy"
question = "Does each secondary character justify their place, and could any be merged or cut without loss?"
look_for = ["two characters with the same function", "near-identical names or initials", "walk-on characters with long introductions", "characters appearing in one block and never again"]
method = "hybrid"
kind = "diagnostic"
action_level = "structural"
inputs = ["characters", "relationships", "L1", "metrics"]
metrics = ["character_first_appearance", "name_similarity_pairs", "character_presence_matrix"]
evidence = "Candidates for merge or cut with the functions they carry, the scenes they appear in, and what their removal would affect (relationships, setups, knowledge)."
severity = { high = "Cast size or name similarity confuses the reader in main scenes.", medium = "Several characters could be merged without loss.", low = "Minor surplus." }

[[check]]
id = "characters.too-perfect"
title = "Exemplary, infallible or one-note characters"
question = "Is any character too good, too wise, too right or too uniform to feel alive?"
look_for = ["a figure who is never wrong", "flaws mentioned but never costly", "a villain with no logic of their own"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "L2"]
evidence = "Scenes where the character is tested and what it costs them, or the absence of such scenes. Archetypal figures in fable, myth or comic modes are judged by that mode."
severity = { high = "A central character is flawless or one-note so the story loses tension or credibility.", medium = "Flaws are told but never costly.", low = "Tendency in a secondary figure." }

[[check]]
id = "characters.autonomy"
title = "Autonomy and fair opposition of ideas"
question = "Do characters act, speak and think with their own logic — including against the narrator's or author's preferred view — and where they differ on ideas or values, do they engage as persons rather than positions?"
look_for = ["characters echoing the narrator's phrasing", "opponents who lose every argument", "mentor figures who only transmit doctrine", "ideas debated without emotional stakes for the speakers"]
method = "llm"
kind = "diagnostic"
action_level = "scene"
inputs = ["characters", "relationships", "L2", "L3"]
evidence = "Argument, debate or mentoring scenes with the strongest case given to each side, and short quotes showing narrator steering; L3 only for the cited scenes."
severity = { high = "Characters act as mouthpieces and the theme depends on a rigged debate.", medium = "Some opponents are strawmen or positions are impersonal.", low = "Occasional narrator steering." }

[[check]]
id = "characters.character-strength"
title = "Character strengths"
question = "Which characters or moments are vivid and must be protected in revision?"
look_for = ["a gesture that reveals a person", "a contradiction handled well", "a minor character who sticks"]
method = "llm"
kind = "strength"
action_level = "none"
inputs = ["characters", "L2"]
evidence = "Named characters or scenes with anchors and what makes them work."

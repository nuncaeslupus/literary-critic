repos:
  - repo: local
    hooks:
      - id: litcritic-guard
        name: litcritic content guard
        entry: uv run lc guard
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]

name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make ci
  python311:  # the claude.ai chat sandbox runs Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11
      - run: uv run --python 3.11 pytest -q
  windows:  # writers run Word on Windows; hosted runners are slow, so time gates get slack
    runs-on: windows-latest
    env:
      LITCRITIC_PERF_FACTOR: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
  mcpb:  # the desktop extension: lock in step, packs, and the official validator accepts it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check
      - run: python3 scripts/pack_mcpb.py --out dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          mkdir dist/unpacked
          unzip -q dist/literary-critic-*.mcpb -d dist/unpacked
          npx -y @anthropic-ai/mcpb@2.1.2 validate dist/unpacked/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb

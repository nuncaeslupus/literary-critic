# A finding at any level, from architecture to mechanics.
type = "issue"
prefix = "is"
links = ["about", "refers_to", "depends_on"]
columns = ["level", "severity", "kind", "check", "question"]
spans_required = false

[schema]
type = "object"
required = ["level", "severity"]
additionalProperties = false
[schema.properties.level]
enum = ["book", "part", "chapter", "scene", "paragraph", "line", "mechanics"]
[schema.properties.severity]
enum = ["high", "medium", "low"]
[schema.properties.kind]
enum = ["problem", "strength"]
[schema.properties.confidence]
type = "number"
minimum = 0
maximum = 1
[schema.properties.effort]
enum = ["S", "M", "L"]
[schema.properties.check]
type = "string"
[schema.properties.question]
type = "string"
[schema.properties.why]
type = "string"
[schema.properties.options]
type = "array"
items = { type = "string", minLength = 1 }

# The bible: characters, places, objects, groups and world rules.
type = "entity"
prefix = "en"
# same_as: one character under two names the text keeps apart (Jekyll / Hyde), two
# entities linked; plain aliases stay in one entity.
links = ["knows", "part_of", "refers_to", "depends_on", "contradicts", "about", "same_as"]
columns = ["kind", "name"]
spans_required = false
standalone = true

[schema]
type = "object"
required = ["kind", "name"]
additionalProperties = false
[schema.properties.kind]
enum = ["character", "place", "object", "group", "rule", "motif"]
[schema.properties.name]
type = "string"
minLength = 1
[schema.properties.aliases]
type = "array"
items = { type = "string", minLength = 1 }
# Role titles used as names ("the doctor"): counted as mentions only in scenes where
# the entity is also named.
[schema.properties.titles]
type = "array"
items = { type = "string", minLength = 1 }
[schema.properties.exact_case]
type = "boolean"

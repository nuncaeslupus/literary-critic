# Spanish word lists for the index pre-pass (`litcritic.prepass`).
# Case matters where noted; everything else is matched lower case.

# Capitalised titles that precede a name; a trailing period is optional.
honorifics = ["D", "Dª", "Dña", "Sr", "Sra", "Srta", "Don", "Doña", "Dr", "Dra", "Fray", "Sor", "Señor", "Señora", "Señorita", "Señá", "Tío", "Tía", "Doctor", "Doctora", "Padre", "Madre", "Hermano", "Hermana", "Capitán", "Coronel", "General", "Maestro", "Maestra", "Mister", "Míster", "Madame", "Monsieur"]
# Lower-case titles that precede a capitalised name ("señor Centeno").
honorifics_lower = ["don", "doña", "señor", "señora", "señorita", "señorito", "señá", "seña", "tío", "tía", "doctor", "doctora", "padre", "madre", "fray", "sor", "maestro", "maestra", "capitán", "coronel", "general", "marqués", "marquesa", "conde", "condesa", "duque", "duquesa", "mister", "míster"]
# Articles that may stand before a name (nicknames, places); plural ones mark groups.
articles = ["el", "la", "los", "las"]
plural_articles = ["los", "las"]
# Words that join the capitalised parts of one name; never joined before a common noun.
connectors = ["de", "del", "de la", "de los", "de las"]
# Prepositions that, before a name, hint at a place.
place_preps = ["en", "desde", "hacia", "hasta", "para"]
# Definite articles used before role titles ("el doctor").
role_articles = ["el", "la"]

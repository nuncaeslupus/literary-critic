<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The MCP App behind literary-critic's `change_card` tool: one or more proposed changes (a
     batch is one card) with two buttons for all of them, Approve and Dismiss, and a "Show in
     Word" button per change. A click calls the extension's app-only `change_approve`,
     `change_dismiss` or `change_go` tool through the host with the change id only (the page
     never sends text to write), so approving takes one click and no assistant turn. A batch
     approves each change without moving Word, then takes Word to the first. On load it asks
     the app-only `change_status` tool for each change's status now (the tool result is from
     when the card was first shown), and a change already approved, dismissed or undone shows
     as settled; its Show in Word button stays. It never sends a chat message (the host
     would make the writer press Send under a caution banner, a second action): when the host
     advertises `updateModelContext` it records the outcome there for the model's next turn,
     and the model can always ask `change_status`. The words shown come from the card's
     `buttons` (the novel's language). Self-contained (no CDN): hosts sandbox app frames. -->
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; margin: 8px; background: transparent; color: CanvasText; }
  #status { font-size: 12px; opacity: .7; margin-bottom: 4px; }
  #card { border: 1px solid #8886; border-radius: 8px; padding: 10px 12px; }
  .change + .change { border-top: 1px solid #8884; margin-top: 8px; padding-top: 8px; }
  .text { margin: 0 0 6px; }
  .meta { font-size: 12px; opacity: .75; margin: 2px 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .state { font-size: 13px; flex: 1; }
  .state.ok { color: #2a2; }
  .state.err { color: #c33; }
  .state.settled { opacity: .8; }
  .state.busy { font-weight: 600; }
  .state.busy::before {
    content: ""; display: inline-block; width: .8em; height: .8em; margin-right: .4em;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    vertical-align: -.1em; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #buttons { display: flex; gap: 8px; margin-top: 10px; }
  button {
    padding: 8px 10px; border-radius: 8px; border: 1px solid #8886;
    background: #8881; color: inherit; font: inherit; cursor: pointer;
  }
  #buttons button { flex: 1; }
  .go { padding: 4px 8px; font-size: 13px; }
  button:hover { background: #8882; }
  button:disabled { opacity: .6; cursor: default; }
  #result { margin-top: 8px; font-size: 13px; }
  #result.ok { color: #2a2; }
  #result.err { color: #c33; }
  #result.settled { opacity: .8; }
</style>
</head>
<body>
<div id="status">Loading the change…</div>
<div id="card" hidden>
  <div id="list"></div>
  <div id="buttons">
    <button id="approve" type="button">Approve</button>
    <button id="dismiss" type="button">Dismiss</button>
  </div>
  <div id="result"></div>
</div>
<script>
"use strict";
let nextId = 0;
const pending = {};
let canContext = false;
let work = null;
let rows = [];  // {id, status, state (element), go (button)}
let labels = {
  approve: "Approve", dismiss: "Dismiss", go: "Show in Word", approved: "✓ Approved",
  typed: "✓ Approved: you type it in", dismissed: "Dismissed", undone: "Undone",
  change: "Change", changes: "Changes", applying: "Applying the change in Word…",
  dismissing: "Dismissing…",
};
const $ = id => document.getElementById(id);
const send = message => window.parent.postMessage(message, "*");

function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending[id] = { resolve, reject };
    send({ jsonrpc: "2.0", id, method, params });
  });
}

function resize() {
  send({
    jsonrpc: "2.0", method: "ui/notifications/size-changed",
    params: { width: document.body.scrollWidth, height: document.body.scrollHeight + 16 },
  });
}

function result(text, cls) {
  const el = $("result");
  el.textContent = text;
  el.className = cls || "";
  resize();
}

function mark(row, text, cls) {
  row.state.textContent = text;
  row.state.className = "state " + (cls || "");
  resize();
}

function add(change) {
  const card = change.card || {};
  const box = document.createElement("div");
  box.className = "change";
  const text = document.createElement("p");
  text.className = "text";
  text.textContent = card.text || "";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [card.words_by, card.why].filter(Boolean).join(" · ");
  const line = document.createElement("div");
  line.className = "row";
  const state = document.createElement("span");
  state.className = "state";
  const go = document.createElement("button");
  go.type = "button";
  go.className = "go";
  go.textContent = labels.go;
  line.append(state, go);
  box.append(text, meta, line);
  $("list").append(box);
  const row = { id: change.id, status: change.status, state, go };
  go.onclick = () => show(row);
  return row;
}

function render(data) {
  work = data.work;
  const changes = data.changes || [{ id: data.id, status: data.status, card: data.card }];
  const first = (changes[0] || {}).card || {};
  labels = { ...labels, ...(first.buttons || {}) };
  $("approve").textContent = labels.approve;
  $("dismiss").textContent = labels.dismiss;
  $("list").textContent = "";
  rows = changes.map(add);
  $("card").hidden = false;
  $("status").textContent = (rows.length > 1 ? labels.changes : labels.change) + " " + rows.map(r => r.id).join(", ");
  resize();
  rows.forEach(row => settle(row, row.status));
  if (live().length) {
    // Hold the buttons until the server says whether the changes are still proposed.
    hold(true);
    Promise.all(live().map(async row => settle(row, await liveStatus(row)))).then(() => {
      if (live().length) hold(false);
    });
  }
}

// A change no longer proposed (or refused, which can be approved again) is settled: say what
// became of it in plain words. Undefined for a live change.
const SETTLED = () => ({
  approved: labels.approved, applied: labels.approved, typed_by_writer: labels.typed,
  dismissed: labels.dismissed, undone: labels.undone,
});

const live = () => rows.filter(row => !row.settled);

function hold(on) { $("approve").disabled = $("dismiss").disabled = on; }

// Settle one change; once none is left to decide, take the Approve and Dismiss buttons away
// (each change keeps its Show in Word button).
function settle(row, status) {
  const words = SETTLED()[status];
  if (!words) return false;
  row.settled = true;
  row.status = status;
  mark(row, words, words.startsWith("✓") ? "ok" : "settled");
  if (!live().length) {
    hold(true);
    $("buttons").hidden = true;
  }
  return true;
}

// A change's status now; null when the server cannot say (the card then stays as shown).
// A host that never answers counts as "cannot say" after a few seconds.
async function liveStatus(row) {
  const call = request("tools/call", { name: "change_status", arguments: { work, change: row.id } });
  const late = new Promise(resolve => setTimeout(() => resolve(null), 4000));
  try {
    const res = await Promise.race([call, late]);
    if (res && !res.isError) return JSON.parse(res.content[0].text).status || null;
  } catch (e) { /* keep the card as shown */ }
  return null;
}

// A tool error arrives as {isError: true, content: [{text: '{"error": code, "message": ...}'}]}.
function failure(res) {
  try {
    const e = JSON.parse(res.content[0].text);
    return { code: e.error || "", text: e.message || e.error || "error" };
  } catch (e) { return { code: "", text: "error" }; }
}

// One change: true when it was done (or turned out already settled).
async function one(name, row, extra) {
  // Plain words and a spinner while it runs: a bare "…" went unnoticed.
  const busy = name === "change_dismiss" ? labels.dismissing : labels.applying;
  mark(row, busy || "…", "busy");
  try {
    const res = await request("tools/call", { name, arguments: { work, change: row.id, ...extra } });
    if (res.isError) {
      const why = failure(res);
      // Already settled (approved, dismissed or undone elsewhere): say so, not an error.
      if (why.code === "not_proposed" && settle(row, await liveStatus(row))) return false;
      // The change stays actionable after another refusal, so the writer can try again.
      mark(row, "✗ " + why.text, "err");
      return false;
    }
    return true;
  } catch (e) {
    mark(row, "✗ " + ((e && e.message) || "error"), "err");
    return false;
  }
}

async function act(name, done, status) {
  const todo = live();
  if (!todo.length) return;
  hold(true);
  // A single change goes to its place as it is approved; a batch goes once, to the first.
  const extra = name === "change_approve" && todo.length > 1 ? { go: false } : {};
  const ok = [];
  for (const row of todo) {
    if (await one(name, row, extra)) {
      ok.push(row);
      settle(row, status);
    }
  }
  if (live().length) hold(false);
  // Each change says what became of it on its own row: no second line repeating it.
  result("");
  if (extra.go === false && ok.length) show(ok[0]);
  if (canContext && ok.length) {
    request("ui/update-model-context", {
      content: [{ type: "text", text: "The writer clicked " + done + ": " + ok.map(r => r.id).join(", ") }],
    }).catch(() => {});
  }
}

// Show in Word: Word opens the document when it is not open and goes to the change.
async function show(row) {
  row.go.disabled = true;
  try {
    const res = await request("tools/call", { name: "change_go", arguments: { work, change: row.id } });
    if (res.isError) result("✗ " + failure(res).text, "err");
  } catch (e) {
    result("✗ " + ((e && e.message) || "error"), "err");
  }
  row.go.disabled = false;
}

$("approve").onclick = () => act("change_approve", "approve", "applied");
$("dismiss").onclick = () => act("change_dismiss", "dismiss", "dismissed");

window.addEventListener("message", event => {
  const m = event.data;
  if (event.source !== window.parent || !m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && !m.method && pending[m.id]) {
    const p = pending[m.id];
    delete pending[m.id];
    m.error ? p.reject(m.error) : p.resolve(m.result);
    return;
  }
  if (m.method === "ui/notifications/tool-result") {
    const sc = (m.params || {}).structuredContent;
    if (sc && (sc.card || sc.changes)) render(sc);
    else $("status").textContent = "No change to show.";
  }
  if (m.method === "ping" && m.id !== undefined) send({ jsonrpc: "2.0", id: m.id, result: {} });
});

let initialized = false;
function markInitialized() {
  if (initialized) return;
  initialized = true;
  send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
}
const info = { name: "literary-critic-change", version: "1" };
request("ui/initialize", {
  protocolVersion: "2026-01-26", appInfo: info, clientInfo: info, appCapabilities: {}, capabilities: {},
}).then(res => {
  // The outcome goes to the model's context only when the host takes it; never a chat message.
  canContext = !!((res || {}).hostCapabilities || {}).updateModelContext;
  markInitialized();
}, markInitialized);
setTimeout(markInitialized, 1500);
resize();
</script>
</body>
</html>

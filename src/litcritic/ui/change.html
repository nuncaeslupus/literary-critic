<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The MCP App behind literary-critic's `change_card` tool: one proposed change with exactly
     two buttons. A click calls the extension's app-only `change_approve` / `change_dismiss`
     tool through the host with the change id only (the page never sends text to write), so
     approving takes one click and no assistant turn. On load it asks the app-only
     `change_status` tool for the change's status now (the tool result is from when the card
     was first shown), and a change already approved, dismissed or undone shows as settled
     with no buttons. Afterwards it sends a `ui/message` when
     the host advertises that capability. Self-contained (no CDN): hosts sandbox app frames. -->
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; margin: 8px; background: transparent; color: CanvasText; }
  #status { font-size: 12px; opacity: .7; margin-bottom: 4px; }
  #card { border: 1px solid #8886; border-radius: 8px; padding: 10px 12px; }
  #text { margin: 0 0 6px; }
  #meta { font-size: 12px; opacity: .75; margin: 2px 0; }
  #buttons { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #8886;
    background: #8881; color: inherit; font: inherit; cursor: pointer;
  }
  button:hover { background: #8882; }
  button:disabled { opacity: .6; cursor: default; }
  #result { margin-top: 8px; font-size: 13px; }
  #result.ok { color: #2a2; }
  #result.err { color: #c33; }
  #result.settled { opacity: .8; }
</style>
</head>
<body>
<div id="status">Loading the change…</div>
<div id="card" hidden>
  <p id="text"></p>
  <div id="meta"></div>
  <div id="buttons">
    <button id="approve" type="button">Approve</button>
    <button id="dismiss" type="button">Dismiss</button>
  </div>
  <div id="result"></div>
</div>
<script>
"use strict";
let nextId = 0;
const pending = {};
let canMessage = false;
let shown = null;
const $ = id => document.getElementById(id);
const send = message => window.parent.postMessage(message, "*");

function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending[id] = { resolve, reject };
    send({ jsonrpc: "2.0", id, method, params });
  });
}

function resize() {
  send({
    jsonrpc: "2.0", method: "ui/notifications/size-changed",
    params: { width: document.body.scrollWidth, height: document.body.scrollHeight + 16 },
  });
}

function result(text, cls) {
  const el = $("result");
  el.textContent = text;
  el.className = cls || "";
  resize();
}

function render(data) {
  shown = { work: data.work, change: data.id };
  const card = data.card || {};
  $("text").textContent = card.text || "";
  const meta = [];
  if (card.words_by) meta.push(card.words_by);
  if (card.why) meta.push(card.why);
  $("meta").textContent = meta.join(" · ");
  $("card").hidden = false;
  $("status").textContent = "Change " + data.id;
  resize();
  if (!settle(data.status)) {
    // Hold the buttons until the server says whether the change is still proposed.
    $("approve").disabled = $("dismiss").disabled = true;
    liveStatus().then(status => {
      if (!settle(status)) $("approve").disabled = $("dismiss").disabled = false;
    });
  }
}

// A change no longer proposed (or refused, which can be approved again) is settled: say what
// became of it in plain words and take the buttons away. Undefined for a live change.
const SETTLED = {
  approved: "✓ Approved", applied: "✓ Approved", typed_by_writer: "✓ Approved: you type it in",
  dismissed: "Dismissed", undone: "Undone",
};

function settle(status) {
  const words = SETTLED[status];
  if (!words) return false;
  $("approve").disabled = $("dismiss").disabled = true;
  $("buttons").hidden = true;
  result(words, words.startsWith("✓") ? "ok" : "settled");
  return true;
}

// The change's status now; null when the server cannot say (the card then stays as shown).
// A host that never answers counts as "cannot say" after a few seconds.
async function liveStatus() {
  const call = request("tools/call", { name: "change_status", arguments: { ...shown } });
  const late = new Promise(resolve => setTimeout(() => resolve(null), 4000));
  try {
    const res = await Promise.race([call, late]);
    if (res && !res.isError) return JSON.parse(res.content[0].text).status || null;
  } catch (e) { /* keep the card as shown */ }
  return null;
}

// A tool error arrives as {isError: true, content: [{text: '{"error": code, "message": ...}'}]}.
function failure(res) {
  try {
    const e = JSON.parse(res.content[0].text);
    return { code: e.error || "", text: e.message || e.error || "error" };
  } catch (e) { return { code: "", text: "error" }; }
}

async function act(name, done) {
  if (!shown) return;
  $("approve").disabled = $("dismiss").disabled = true;
  result("…");
  try {
    const res = await request("tools/call", { name, arguments: { ...shown } });
    if (res.isError) {
      const why = failure(res);
      // Already settled (approved, dismissed or undone elsewhere): say so, not an error.
      if (why.code === "not_proposed" && settle(await liveStatus())) return;
      // The card stays actionable after another refusal, so the writer can try again.
      $("approve").disabled = $("dismiss").disabled = false;
      result("✗ " + why.text, "err");
      return;
    }
    result("✓ " + done, "ok");
    if (canMessage) {
      request("ui/message", {
        role: "user", content: [{ type: "text", text: done + " " + shown.change }],
      }).catch(() => {});
    }
  } catch (e) {
    $("approve").disabled = $("dismiss").disabled = false;
    result("✗ " + ((e && e.message) || "error"), "err");
  }
}

$("approve").onclick = () => act("change_approve", "Approved");
$("dismiss").onclick = () => act("change_dismiss", "Dismissed");

window.addEventListener("message", event => {
  const m = event.data;
  if (event.source !== window.parent || !m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && !m.method && pending[m.id]) {
    const p = pending[m.id];
    delete pending[m.id];
    m.error ? p.reject(m.error) : p.resolve(m.result);
    return;
  }
  if (m.method === "ui/notifications/tool-result") {
    const sc = (m.params || {}).structuredContent;
    if (sc && sc.card) render(sc);
    else $("status").textContent = "No change to show.";
  }
  if (m.method === "ping" && m.id !== undefined) send({ jsonrpc: "2.0", id: m.id, result: {} });
});

let initialized = false;
function markInitialized() {
  if (initialized) return;
  initialized = true;
  send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
}
const info = { name: "literary-critic-change", version: "1" };
request("ui/initialize", {
  protocolVersion: "2026-01-26", appInfo: info, clientInfo: info, appCapabilities: {}, capabilities: {},
}).then(res => {
  // ui/message is sent only when the host says it takes it (spec Q-1).
  canMessage = !!((res || {}).hostCapabilities || {}).message;
  markInitialized();
}, markInitialized);
setTimeout(markInitialized, 1500);
resize();
</script>
</body>
</html>
